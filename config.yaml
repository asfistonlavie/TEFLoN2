# All paths can be relative or absolute

DEPENDENCIES:
  PYTHON3: "/path/to/python3"         # [required] Path to the Python 3 executable
  BWA: "/path/to/bwa"                 # [required] Path to the BWA executable
  SAMTOOLS: "/path/to/samtools"       # [required] Path to the Samtools executable
  AWK: "/path/to/awk"                 # [required] Path to the awk executable
  FASTP: "/path/to/fastp"             # [required if filterfastq is enabled] Path to fastp executable
  REPEATMASKER: "/path/to/repeatmasker" # [required if prep_custom is enabled] Path to RepeatMasker executable

DATA_INPUT:
  WORKING_DIRECTORY: "data_input"     # [required] Path to the input data folder (default is "data_input")
  GENOME: "name_reference_file.fasta" # [required] Reference genome file name (must be located in data_input/reference)
  ANNOTATION: "name_annotation_file.bed" # [required if prep_annotation is enabled] Annotation file name in data_input/library
  LIBRARY: "name_TE_library.fasta"    # [required if prep_custom is enabled; optional if prep_annotation is used] TE library file for your organism in data_input/library
  HIERARCHY: "name_TE_hierarchy.txt"  # [required if prep_annotation is enabled] TE hierarchy file in data_input/library

PARAMS:
  GENERAL:
    WORKING_DIRECTORY: ""             # [optional] Working directory (default: current directory)
    PREFIX: "name_run"                # [required] Name of the run
    MEMORY: 30000                     # [required] Memory in MB allocated per rule
    MEMORY_SUPP: 20000                # [required] Additional memory for retries

  COMPRESS:
    THREADS: 10

  FILTERFASTQ:
    USE: 0                            # [required] 0: skip fastp filtering; 1: use fastp filtering
    THREADS: 10

  SAMTOOLS:
    THREADS: 10                       # [required] Max number of threads to use

  PREP_ANNOTATION:
    STOP: 0                           # [required] 0: continue beyond this step; 1: stop after TEFLoN_prep_annotation

  PREP_CUSTOM:
    SPECIES: ""                       # Species name (must match NCBI Taxonomy and be present in RepeatMasker database)
    CUTOFF: ""                        # [optional] SW cutoff score for RepeatMasker (default = 250)
    FRAG: ""                          # [optional] Max sequence length masked without splitting (default = 60,000)
    ENGINE: ""                        # [optional] Alternative RepeatMasker engine: crossmatch | wublast | abblast | ncbi | rmblast | hmmer
    MIN_LENGTH: ""                   # [optional] Minimum TE length to keep (default = 200)
    SPLIT_DIST: ""                   # [optional] Minimum distance between TEs before splitting (default = 200)
    DIVERGENCE: ""                   # [optional] Max % divergence from consensus (default = 20)
    THREADS: 16                      # [required] Max threads to use
    STOP: 0                          # [required] 0: continue; 1: stop after TEFLoN_prep_custom

  DISCOVER:
    LEVEL_HIERARCHY1: "family"        # [required] Hierarchy level for initial TE detection
    LEVEL_HIERARCHY2: "class"         # [required] Grouping level (should be equal or higher than LEVEL_HIERARCHY1)
    QUALITY: "20"                     # [required] Minimum mapping quality
    EXCLUDE: ""                       # [optional] File listing TE families to exclude
    STANDARD_DEVIATION: ""            # [optional] Override insert size StdDev (check stats.txt)
    COVERAGE_OVERRIDE: ""            # [optional] Override coverage estimate
    THREADS: 16                       # [required]
    STOP: 0                           # [required] 0: continue; 1: stop after TEFLoN_discover

  COLLAPSE:
    THRESHOLD_SAMPLE: "1"             # [required] Min reads per TE in at least one sample
    THRESHOLD_ALL: "1"                # [required] Min reads per TE summed across all samples
    COVERAGE_OVERRIDE: ""            # [optional]
    QUALITY: "20"                     # [required]
    THREADS: 16                       # [required]
    STOP: 0                           # [required] 0: continue; 1: stop after TEFLoN_collapse

  COUNT:
    QUALITY: "20"                     # [required]
    THREADS: 20                       # [required]
    STOP: 0                           # [required]

  GENOTYPE:
    THRESHOLD_LOWER: "1"              # [optional] Lower threshold for adjusted read counts (default = 1)
    THRESHOLD_HIGHER: "100"           # [optional] Upper threshold for adjusted read counts (default = mean + 2×SD)
    DATA_TYPE: "pooled"               # [required] One of: haploid, diploid, pooled

    SAMPLE:
      THRESHOLD_ABSENCE: ""          # [optional] Lower presence threshold (default = 0.05)
      THRESHOLD_PRESENCE: ""         # [optional] Upper presence threshold (default = 0.95)

    POPULATION:
      FILE: ""                        # [optional] Path to population file
      THRESHOLD_ABSENCE: ""          # [optional] Default = 0.05
      THRESHOLD_PRESENCE: ""         # [optional] Default = 0.95
