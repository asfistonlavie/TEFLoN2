<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TEFLON2_TITLE__</title>
<style>
:root{--bg:#ffffff;--panel:#f6f7f9;--text:#1c2430;--muted:#667085;--line:#d9dde3;--accent:#2f6fdd;--warn:#c2410c;--warnbg:#fff1e6;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--panel:#1d2128;--text:#e6e9ee;--muted:#9aa4b2;--line:#323843;--accent:#6ea0ff;--warn:#fb923c;--warnbg:#3a2616;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 28px 0;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--muted);font-size:12px;margin-bottom:10px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--muted);padding:10px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:22px 28px 60px;max-width:1300px}
section{display:none}section.on{display:block}
h2{font-size:16px;margin:26px 0 8px}h2:first-child{margin-top:0}
p.note{color:var(--muted);margin:2px 0 10px;max-width:900px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.card b{display:block;font-size:22px}.card span{color:var(--muted);font-size:12px}
.card.warn{border-color:var(--warn)}.card.warn b{color:var(--warn)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0 12px;overflow-x:auto}
.chart svg{display:block;max-width:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:4px 6px}
.legend span{cursor:pointer;display:inline-flex;align-items:center;gap:5px}.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.legend .off{opacity:.35}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{cursor:pointer;background:var(--panel);position:sticky;top:0;user-select:none}
.tablewrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:1px 8px;margin-right:4px;font-size:11px}
.ok{color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}
input,select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
svg text{fill:var(--text);font-size:11px}svg .ax{stroke:var(--line)}svg .mut{fill:var(--muted)}
.heat td{text-align:center}
.row button{font:inherit;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer}
#gb svg{user-select:none;cursor:grab}.gl{cursor:pointer}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><div class="sub" id="sub"></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script id="data" type="application/json">__TEFLON2_DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const PAL = ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#bab0ac','#1f77b4','#8c564b'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n === null || n === undefined ? '–' : (typeof n === 'number' ? (Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined,{maximumFractionDigits:2})) : esc(n));
const sum = a => a.reduce((x, y) => x + y, 0);

function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const m=v/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
function legendHTML(names, colors, off){ return '<div class="legend">'+names.map((n,i)=>'<span data-i="'+i+'" class="'+(off&&off.has(i)?'off':'')+'"><i style="background:'+colors[i]+'"></i>'+esc(n)+'</span>').join('')+'</div>'; }

/* ---------- bar chart: vertical (grouped/stacked) or horizontal stacked ---------- */
function barChart(host, o){
  const el = document.getElementById(host); const off = new Set();
  const colors = o.colors || o.series.map((_, i) => PAL[i % PAL.length]);
  function draw(){
    const W = Math.max(560, o.width || el.clientWidth - 20), n = o.labels.length;
    const ser = o.series.map((s, i) => ({...s, i})).filter(s => !off.has(s.i));
    const horiz = !!o.horizontal, rot = !horiz && n > 14;
    const L = horiz ? 150 : 62, R = 14, T = 10, B = horiz ? 28 : (rot ? 84 : 34);
    const H = horiz ? Math.max(180, n * 22 + T + B) : (o.height || 320);
    const iw = W - L - R, ih = H - T - B;
    const tot = o.labels.map((_, j) => o.stacked || horiz ? sum(ser.map(s => s.values[j])) : Math.max(0, ...ser.map(s => s.values[j])));
    const ymax = niceMax(Math.max(1, ...tot));
    let g = '';
    for(let t = 0; t <= 4; t++){
      const v = ymax * t / 4;
      if(horiz){ const x = L + iw * t / 4; g += '<line class="ax" x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(T+ih)+'"/><text class="mut" x="'+x+'" y="'+(H-10)+'" text-anchor="middle">'+fmt(v)+'</text>'; }
      else { const y = T + ih - ih * t / 4; g += '<line class="ax" x1="'+L+'" x2="'+(L+iw)+'" y1="'+y+'" y2="'+y+'"/><text class="mut" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(o.pct?v+'%':fmt(v))+'</text>'; }
    }
    const step = Math.max(1, Math.ceil(n / (horiz ? 999 : iw / (rot ? 13 : 60))));
    o.labels.forEach((lab, j) => {
      const gw = (horiz ? ih : iw) / n; let acc = 0;
      const cnt = o.stacked || horiz ? 1 : ser.length, bw = gw * 0.78 / cnt;
      ser.forEach((s, k) => {
        const v = s.values[j]; const tip = '<title>'+esc(lab)+' · '+esc(s.name)+': '+fmt(v)+'</title>';
        const len = (horiz ? iw : ih) * v / ymax;
        if(horiz){ g += '<rect x="'+(L+acc)+'" y="'+(T+j*gw+gw*0.11)+'" width="'+len+'" height="'+(gw*0.78)+'" fill="'+colors[s.i]+'">'+tip+'</rect>'; acc += len; }
        else if(o.stacked){ g += '<rect x="'+(L+j*gw+gw*0.11)+'" y="'+(T+ih-acc-len)+'" width="'+(gw*0.78)+'" height="'+len+'" fill="'+colors[s.i]+'">'+tip+'</rect>'; acc += len; }
        else g += '<rect x="'+(L+j*gw+gw*0.11+k*bw)+'" y="'+(T+ih-len)+'" width="'+bw+'" height="'+len+'" fill="'+colors[s.i]+'">'+tip+'</rect>';
      });
      if(j % step === 0){
        if(horiz) g += '<text x="'+(L-6)+'" y="'+(T+j*gw+gw*0.62)+'" text-anchor="end">'+esc(String(lab).slice(0,22))+'</text>';
        else { const x = L + j*gw + gw/2, y = T + ih + 14;
          g += rot ? '<text transform="translate('+x+','+y+') rotate(-55)" text-anchor="end">'+esc(String(lab).slice(0,16))+'</text>' : '<text x="'+x+'" y="'+y+'" text-anchor="middle">'+esc(String(lab).slice(0,14))+'</text>'; }
      }
    });
    if(o.ytitle) g += '<text class="mut" transform="translate(12,'+(T+ih/2)+') rotate(-90)" text-anchor="middle">'+esc(o.ytitle)+'</text>';
    el.innerHTML = (o.series.length > 1 ? legendHTML(o.series.map(s => s.name), colors, off) : '') + '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
    el.querySelectorAll('.legend span').forEach(sp => sp.onclick = () => { const i = +sp.dataset.i; off.has(i) ? off.delete(i) : off.add(i); draw(); });
  }
  draw();
}

/* ---------- scatter ---------- */
function scatter(host, o){
  const el = document.getElementById(host); const groups = [...new Set(o.points.map(p => p.g))]; const off = new Set();
  const col = g => PAL[groups.indexOf(g) % PAL.length];
  function draw(){
    const W = Math.max(560, el.clientWidth - 20), H = o.height || 380, L = 62, R = 14, T = 10, B = 40, iw = W-L-R, ih = H-T-B;
    const pts = o.points.filter(p => p.x !== null && p.y !== null && !off.has(p.g));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    if(!pts.length){ x0=0;x1=1;y0=0;y1=1; } if(x0===x1){x0-=1;x1+=1;} if(y0===y1){y0-=1;y1+=1;}
    const px = (x1-x0)*0.05, py = (y1-y0)*0.05; x0-=px;x1+=px;y0-=py;y1+=py;
    const sx = x => L + iw*(x-x0)/(x1-x0), sy = y => T + ih - ih*(y-y0)/(y1-y0); let g = '';
    for(let t = 0; t <= 4; t++){ const xv = x0+(x1-x0)*t/4, yv = y0+(y1-y0)*t/4;
      g += '<line class="ax" x1="'+L+'" x2="'+(L+iw)+'" y1="'+sy(yv)+'" y2="'+sy(yv)+'"/><text class="mut" x="'+(L-6)+'" y="'+(sy(yv)+4)+'" text-anchor="end">'+fmt(+yv.toPrecision(3))+'</text>';
      g += '<text class="mut" x="'+sx(xv)+'" y="'+(T+ih+16)+'" text-anchor="middle">'+fmt(+xv.toPrecision(3))+'</text>'; }
    pts.forEach(p => g += '<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="'+(p.r||4.5)+'" fill="'+col(p.g)+'" fill-opacity=".8"><title>'+esc(p.t)+'</title></circle>');
    g += '<text class="mut" x="'+(L+iw/2)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(o.xtitle||'')+'</text><text class="mut" transform="translate(12,'+(T+ih/2)+') rotate(-90)" text-anchor="middle">'+esc(o.ytitle||'')+'</text>';
    el.innerHTML = (groups.length > 1 ? legendHTML(groups.map(g => g || 'no population'), groups.map(col), new Set([...off].map(x => groups.indexOf(x)))) : '') + '<svg width="'+W+'" height="'+H+'">'+g+'</svg>';
    el.querySelectorAll('.legend span').forEach(sp => sp.onclick = () => { const g = groups[+sp.dataset.i]; off.has(g) ? off.delete(g) : off.add(g); draw(); });
  }
  draw();
}

/* ---------- sortable table ---------- */
function table(host, cols, rows, o){
  o = o || {}; const el = document.getElementById(host); let sortKey = null, dir = 1, q = '';
  function draw(){
    let r = rows.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q));
    if(sortKey !== null) r = r.slice().sort((a, b) => { const x = cols[sortKey].v(a), y = cols[sortKey].v(b); return (x === y ? 0 : x === null || x === undefined ? 1 : y === null || y === undefined ? -1 : x > y ? 1 : -1) * dir; });
    el.innerHTML = '<div class="row"><input placeholder="filter…" value="'+esc(q)+'" id="'+host+'_q"><span class="mut" style="color:var(--muted)">'+r.length+' / '+rows.length+'</span></div><div class="tablewrap"><table><thead><tr>'+cols.map((c, i) => '<th class="'+(c.l?'l':'')+'" data-i="'+i+'">'+esc(c.h)+(sortKey===i?(dir>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr></thead><tbody>'+
      r.map(x => '<tr>'+cols.map(c => '<td class="'+(c.l?'l':'')+'">'+(c.f ? c.f(x) : fmt(c.v(x)))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    el.querySelectorAll('th').forEach(th => th.onclick = () => { const i = +th.dataset.i; dir = sortKey === i ? -dir : 1; sortKey = i; draw(); });
    const inp = document.getElementById(host+'_q'); inp.oninput = () => { q = inp.value.toLowerCase(); draw(); document.getElementById(host+'_q').focus(); };
  }
  draw();
}
const cards = list => '<div class="cards">'+list.map(c => '<div class="card'+(c[2]?' warn':'')+'"><b>'+fmt(c[0])+'</b><span>'+esc(c[1])+'</span></div>').join('')+'</div>';
const slot = (id, h) => (h ? '<h2>'+esc(h)+'</h2>' : '') + '<div class="chart" id="'+id+'"></div>';

/* ---------- sections ---------- */
const S = {};
S.overview = () => {
  const flagged = D.qc.filter(q => q.flags.length), cat = D.catalog;
  const med = a => { a = a.filter(x => x !== null).sort((x, y) => x - y); return a.length ? a[Math.floor(a.length/2)] : null; };
  let h = '<h2>Run at a glance</h2>' + cards([[D.n_samples, 'samples'], [cat.total, 'TE insertions in the catalog'], [cat.ref, 'reference insertions'], [cat.denovo, 'de novo insertions'],
    [D.pops ? D.pops.names.length : 0, 'populations'], [med(D.qc.map(q => q.cov_mean)), 'median mean coverage (x)'], [flagged.length, 'samples with a QC flag', flagged.length > 0]]);
  if(flagged.length) h += '<h2>Samples to check</h2><p class="note">Thresholds: mean coverage &lt; '+D.thresholds.min_coverage+'x, mapped reads &lt; '+D.thresholds.min_mapped+' %, properly paired &lt; '+D.thresholds.min_pp+' %, duplicates &gt; 30 %.</p>'+
    '<div class="tablewrap"><table><tbody>'+flagged.map(q => '<tr><td class="l">'+esc(q.id)+'</td><td class="l">'+q.flags.map(f => '<span class="badge">'+esc(f)+'</span>').join('')+'</td></tr>').join('')+'</tbody></table></div>';
  else h += '<p class="ok">All samples pass the quality thresholds.</p>';
  h += '<h2>How to read this report</h2><p class="note"><b>Input quality</b> checks the sequencing data and mapping of each sample. <b>TE landscape</b> describes the insertion catalog. <b>Samples</b> shows what was called in every sample. <b>Populations</b> compares populations (private and shared insertions, frequency spectra, comparison of the two frequency methods). <b>Genome browser</b> displays the insertions along the reference genome (zoom, filters, genes and positional impact when an annotation is provided). <b>PCA</b> shows the structure of the samples based on TE insertions.</p>';
  D.notes.forEach(n => h += '<p class="note">⚠ '+esc(n)+'</p>');
  return h;
};
S.quality = () => slot('q1', 'Mean coverage per sample') + slot('q2', 'Mapping quality of the reads (%)') + slot('q3', 'Insert size') + '<h2>Per-sample metrics</h2><div id="qt"></div>';
S.quality.after = () => {
  const ids = D.qc.map(q => q.id);
  barChart('q1', {labels: ids, series: [{name: 'mean coverage', values: D.qc.map(q => q.cov_mean || 0)}, {name: 'after subsampling', values: D.qc.map(q => q.cov_subsampled || 0)}], ytitle: 'x', colors: [PAL[0], PAL[3]]});
  barChart('q2', {labels: ids, series: [{name: 'mapped', values: D.qc.map(q => q.pct_mapped || 0)}, {name: 'properly paired', values: D.qc.map(q => q.pct_properly_paired || 0)}, {name: 'duplicated', values: D.qc.map(q => q.pct_duplicated || 0)}], pct: true, colors: [PAL[0], PAL[4], PAL[2]]});
  scatter('q3', {points: D.qc.map(q => ({x: q.insert_mean, y: q.insert_sd, g: q.pop, t: q.id+' · mean '+fmt(q.insert_mean)+', sd '+fmt(q.insert_sd)})), xtitle: 'insert size mean (bp)', ytitle: 'insert size SD (bp)', height: 300});
  const num = (h, k) => ({h, v: q => q[k]});
  table('qt', [{h: 'sample', l: true, v: q => q.id}, {h: 'population', l: true, v: q => q.pop}, num('reads', 'raw_reads'), num('mean cov', 'cov_mean'), num('cov SD', 'cov_sd'), num('% mapped', 'pct_mapped'), num('% prop. paired', 'pct_properly_paired'),
    num('% dup', 'pct_duplicated'), num('% MQ0', 'pct_mq0'), num('error rate', 'error_rate'), num('read len', 'read_length'), num('insert', 'insert_mean'), num('insert SD', 'insert_sd'),
    {h: 'flags', l: true, v: q => q.flags.length, f: q => q.flags.length ? q.flags.map(f => '<span class="badge">'+esc(f)+'</span>').join('') : '<span class="ok">ok</span>'}], D.qc);
};
S.landscape = () => { const c = D.catalog;
  return cards([[c.total, 'insertions'], [c.ref, 'reference (' + (100*c.ref/Math.max(1,c.total)).toFixed(1) + ' %)'], [c.denovo, 'de novo (' + (100*c.denovo/Math.max(1,c.total)).toFixed(1) + ' %)']]) +
    '<p class="note">Reference insertions match a TE annotated in the reference genome; de novo insertions do not.</p>' +
    slot('l1', 'By TE order') + slot('l2', 'Top TE families') + slot('l3', 'By sequence'); };
S.landscape.after = () => { const c = D.catalog, two = (rows) => [{name: 'reference', values: rows.map(r => r.ref)}, {name: 'de novo', values: rows.map(r => r.denovo)}];
  barChart('l1', {labels: c.by_order.map(r => r.name), series: two(c.by_order), colors: [PAL[0], PAL[1]], ytitle: 'insertions'});
  barChart('l2', {labels: c.by_family.map(r => r.name), series: two(c.by_family), stacked: true, horizontal: true, colors: [PAL[0], PAL[1]]});
  barChart('l3', {labels: c.by_chrom.map(r => r.name), series: two(c.by_chrom), stacked: true, colors: [PAL[0], PAL[1]], ytitle: 'insertions'}); };
S.samples = () => slot('s1', 'Calls per sample') + slot('s2', 'TE load: fully present insertions') + slot('s3', 'TE load vs mean coverage') + slot('s4', 'Present insertions by TE order') + '<h2>Table</h2><div id="st"></div>';
S.samples.after = () => { const sm = D.samples, ids = sm.map(s => s.id);
  barChart('s1', {labels: ids, stacked: true, series: [{name: 'present', values: sm.map(s => s.present)}, {name: 'polymorphic / heterozygous', values: sm.map(s => s.poly)}, {name: 'absent', values: sm.map(s => s.absent)}, {name: 'no data', values: sm.map(s => s.nodata)}], colors: [PAL[4], PAL[5], '#c9ced6', PAL[2]], ytitle: 'sites'});
  barChart('s2', {labels: ids, stacked: true, series: [{name: 'reference', values: sm.map(s => s.present_ref)}, {name: 'de novo', values: sm.map(s => s.present_denovo)}], colors: [PAL[0], PAL[1]], ytitle: 'insertions'});
  scatter('s3', {points: sm.map(s => ({x: s.cov_mean, y: s.present, g: s.pop, t: s.id+' · cov '+fmt(s.cov_mean)+'x, '+fmt(s.present)+' present'})), xtitle: 'mean coverage (x)', ytitle: 'present insertions'});
  barChart('s4', {labels: ids, stacked: true, series: D.order_names.map((o, i) => ({name: o, values: sm.map(s => s.by_order[i])})), ytitle: 'insertions'});
  table('st', [{h: 'sample', l: true, v: s => s.id}, {h: 'population', l: true, v: s => s.pop}, {h: 'present', v: s => s.present}, {h: 'poly/het', v: s => s.poly}, {h: 'absent', v: s => s.absent}, {h: 'no data', v: s => s.nodata}, {h: 'present ref', v: s => s.present_ref}, {h: 'present de novo', v: s => s.present_denovo}, {h: 'mean cov', v: s => s.cov_mean}], sm); };
S.populations = () => { const P = D.pops;
  let h = '<p class="note">An insertion counts as present in a population when its frequency in that population is above 0. Private = present in that population only; fixed = frequency 1.</p>' +
    '<div id="pt"></div>' + slot('p1', 'Insertions per population') + slot('p2', 'Insertions by TE order') + '<h2>Shared insertions between populations</h2><div class="chart" id="p3"></div>' + slot('p4', 'Most common sharing patterns') +
    '<h2>Frequency spectrum</h2><div class="row"><label>population <select id="psel"><option value="">all</option>'+P.names.map(n => '<option>'+esc(n)+'</option>').join('')+'</select></label></div><p class="note">'+esc(P.sfs_source)+'</p><div class="chart" id="p5"></div>';
  if(P.methods.length) h += '<h2>Read-based vs sample-based frequency</h2><p class="note">Correlation between the two TEFLoN2 methods for every population (r = Pearson, MAD = mean absolute difference).</p><div id="pm"></div>';
  return h; };
S.populations.after = () => { const P = D.pops, names = P.names, st = P.stats;
  table('pt', [{h: 'population', l: true, v: s => s.name}, {h: 'samples', v: s => s.n}, {h: 'insertions present', v: s => s.te_present}, {h: 'fixed', v: s => s.fixed}, {h: 'private', v: s => s.private}, {h: 'reference', v: s => s.ref}, {h: 'de novo', v: s => s.denovo}], st);
  barChart('p1', {labels: names, stacked: true, series: [{name: 'reference', values: st.map(s => s.ref)}, {name: 'de novo', values: st.map(s => s.denovo)}], colors: [PAL[0], PAL[1]], ytitle: 'insertions'});
  barChart('p2', {labels: names, stacked: true, series: D.order_names.map((o, i) => ({name: o, values: st.map(s => s.by_order[i])})), ytitle: 'insertions'});
  const mx = Math.max(1, ...P.shared.flat());
  document.getElementById('p3').innerHTML = '<table class="heat"><thead><tr><th></th>'+names.map(n => '<th>'+esc(n)+'</th>').join('')+'</tr></thead><tbody>'+P.shared.map((r, i) => '<tr><td class="l"><b>'+esc(names[i])+'</b></td>'+r.map(v => '<td style="background:rgba(47,111,221,'+(0.08+0.6*v/mx).toFixed(2)+')">'+fmt(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  barChart('p4', {labels: P.upset.map(u => u.pops.length === names.length ? 'all populations' : u.pops.join(' + ')), series: [{name: 'insertions', values: P.upset.map(u => u.n)}], stacked: true, horizontal: true, colors: [PAL[0]]});
  const sel = document.getElementById('psel'), bins = Array.from({length: 10}, (_, i) => (i/10).toFixed(1)+'–'+((i+1)/10).toFixed(1));
  const draw = () => { const ns = sel.value ? [sel.value] : names; barChart('p5', {labels: bins, series: ns.map(n => ({name: n, values: P.sfs[n]})), colors: ns.map(n => PAL[names.indexOf(n) % PAL.length]), ytitle: 'insertions'}); };
  sel.onchange = draw; draw();

    const rows = [['position', esc(B.chroms[B.c[k]].name + ':' + num(B.s[k]) + (B.e[k] > B.s[k] ? '-' + num(B.e[k]) : ''))],
      ['type', B.r[k] ? 'reference TE (' + esc(B.rid[k]) + ')' : 'de novo insertion'], ['family', esc(B.fams[B.f[k]])], ['TE order', esc(B.orders[B.o[k]])], ['frequency, all samples', pc(B.q[k])]];
    B.pops.forEach((p, j) => rows.push(['frequency ' + esc(p), pc(B.pf[j][k])]));
    if(G) rows.push(['impact', esc(B.impacts[B.i[k]]) + (B.g[k] >= 0 ? ' · gene ' + geneLink(B.g[k]) + ' (' + G.st[B.g[k]] + ')' : '')]);
    $('gbinfo').style.display = ''; $('gbinfo').innerHTML = '<h2 style="margin-top:0">' + esc(B.id[k]) + '</h2>' + kv(rows) + chips(k); draw();
  }
  function showGene(gi){
    const ks = (byGene.get(gi) || []).filter(k => filt[k]), cds = G.cds[gi].length / 2;
    const rows = [['position', esc(B.chroms[G.c[gi]].name + ':' + num(G.s[gi]) + '-' + num(G.e[gi]) + ' (' + G.st[gi] + ')')], ['exons / CDS', (G.ex[gi].length / 2) + ' exon(s), ' + (cds ? cds + ' CDS segment(s)' : 'non-coding')],
      ['TE sites in / near the gene', ks.length + ' (flank ' + fmt(B.flank) + ' bp)']];
    $('gbinfo').style.display = '';
    $('gbinfo').innerHTML = '<h2 style="margin-top:0">' + esc(G.nm[gi]) + (G.nm[gi] !== G.id[gi] ? ' <span style="color:var(--muted);font-weight:400">' + esc(G.id[gi]) + '</span>' : '') + '</h2>' + kv(rows) +
      (ks.length ? '<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th class="l">TE</th><th class="l">type</th><th class="l">family</th><th>position</th><th>freq</th><th class="l">impact</th></tr></thead><tbody>' +
        ks.map(k => '<tr><td class="l"><a href="#" data-k="' + k + '">' + esc(B.id[k]) + '</a></td><td class="l">' + (B.r[k] ? 'reference' : 'de novo') + '</td><td class="l">' + esc(B.fams[B.f[k]]) + '</td><td>' + num(B.s[k]) + '</td><td>' + pc(B.q[k]) + '</td><td class="l">' + esc(B.impacts[B.i[k]]) + '</td></tr>').join('') + '</tbody></table></div>' : '');
    draw();
  }
  function goGene(gi){ st.ci = G.c[gi]; $('gb_chr').value = st.ci; const pad = Math.max(500, (G.e[gi] - G.s[gi]) * .25); setView(G.s[gi] - pad, G.e[gi] + pad); showGene(gi); }
  let tmr = null;
  function updateTables(){ clearTimeout(tmr); tmr = setTimeout(doTables, 120); }
  function doTables(){
    const rows = (lay ? lay.vis : []).slice(0, 5000).map(k => ({k, id: B.id[k], pos: B.s[k], end: B.e[k], type: B.r[k] ? 'reference' : 'de novo', fam: B.fams[B.f[k]], ord: B.orders[B.o[k]], q: B.q[k] < 0 ? null : B.q[k], imp: G ? B.impacts[B.i[k]] : '', gene: G && B.g[k] >= 0 ? G.nm[B.g[k]] : ''}));
    const cols = [{h: 'TE', l: true, v: r => r.id, f: r => '<a href="#" data-k="' + r.k + '">' + esc(r.id) + '</a>'}, {h: 'type', l: true, v: r => r.type}, {h: 'start', v: r => r.pos}, {h: 'end', v: r => r.end}, {h: 'family', l: true, v: r => r.fam}, {h: 'order', l: true, v: r => r.ord}, {h: 'freq %', v: r => r.q}];
    if(G) cols.push({h: 'impact', l: true, v: r => r.imp}, {h: 'gene', l: true, v: r => r.gene});
    table('gbtab', cols, rows);
  }
  function summaries(){
    if(!G) return;
    const rc = new Array(6).fill(0), dc = new Array(6).fill(0), per = new Map();
    for(let k = 0; k < N; k++) if(filt[k]){ (B.r[k] ? rc : dc)[B.i[k]]++; const gi = B.g[k]; if(gi >= 0){ if(!per.has(gi)) per.set(gi, [0, 0, 0, 0, 0, 0]); per.get(gi)[B.i[k]]++; } }
    barChart('gbimp', {labels: B.impacts, series: [{name: 'reference TE', values: rc}, {name: 'de novo', values: dc}], stacked: true, colors: [PAL[0], PAL[2]], ytitle: 'TE sites'});
    const rows = [...per.entries()].map(([gi, c]) => ({gi, name: G.nm[gi], id: G.id[gi], chrom: B.chroms[G.c[gi]].name, start: G.s[gi], end: G.e[gi], strand: G.st[gi], cds: c[0], utr: c[1], intr: c[2], up: c[3], down: c[4], total: sum(c)}))
      .sort((a, b) => (b.cds - a.cds) || (b.utr - a.utr) || (b.total - a.total));
    table('gbgenes', [{h: 'gene', l: true, v: r => r.name, f: r => '<a href="#" data-gi="' + r.gi + '">' + esc(r.name) + '</a>'}, {h: 'id', l: true, v: r => r.id}, {h: 'sequence', l: true, v: r => r.chrom}, {h: 'start', v: r => r.start}, {h: 'end', v: r => r.end}, {h: 'strand', l: true, v: r => r.strand},
      {h: 'CDS', v: r => r.cds}, {h: 'UTR / exon', v: r => r.utr}, {h: 'intron', v: r => r.intr}, {h: 'upstream', v: r => r.up}, {h: 'downstream', v: r => r.down}, {h: 'total', v: r => r.total}], rows);
  }
  function onFilter(){ refilter(); draw(); updateTables(); summaries(); }
  // ---- controls
  const on = (id, ev, fn) => { const e = $(id); if(e) e.addEventListener(ev, fn); };
  const full = () => { st.sel = -1; $('gbinfo').style.display = 'none'; setView(1, len()); };
  on('gb_chr', 'change', () => { st.ci = +$('gb_chr').value; full(); });
  on('gb_reg', 'keydown', e => { if(e.key === 'Enter' && !goRegion($('gb_reg').value)) $('gb_reg').style.borderColor = 'var(--warn)'; else if(e.key === 'Enter') $('gb_reg').style.borderColor = ''; });
  on('gb_reset', 'click', full);
  on('gb_in', 'click', () => { const c = (st.v0 + st.v1) / 2, h = (st.v1 - st.v0 + 1) / 4; setView(c - h, c + h); });
  on('gb_out', 'click', () => { const c = (st.v0 + st.v1) / 2, h = (st.v1 - st.v0 + 1); setView(c - h, c + h); });
  on('gb_l', 'click', () => { const s = (st.v1 - st.v0 + 1) / 2; setView(st.v0 - s, st.v1 - s); });
  on('gb_r', 'click', () => { const s = (st.v1 - st.v0 + 1) / 2; setView(st.v0 + s, st.v1 + s); });
  on('gb_gene', 'keydown', e => { if(e.key !== 'Enter') return; const q = e.target.value.trim().toLowerCase(); if(!q) return;
    let gi = -1; for(let i = 0; i < M && gi < 0; i++) if(G.nm[i].toLowerCase() === q || G.id[i].toLowerCase() === q) gi = i;
    for(let i = 0; i < M && gi < 0; i++) if(G.nm[i].toLowerCase().includes(q) || G.id[i].toLowerCase().includes(q)) gi = i;
    e.target.style.borderColor = gi < 0 ? 'var(--warn)' : ''; if(gi >= 0) goGene(gi); });
  on('gb_type', 'change', e => { st.type = e.target.value; onFilter(); });
  on('gb_ord', 'change', e => { st.ord = +e.target.value; onFilter(); });
  on('gb_fam', 'input', e => { st.fam = e.target.value; onFilter(); });
  on('gb_fmin', 'change', e => { st.fmin = Math.max(0, Math.min(100, +e.target.value || 0)); onFilter(); });
  on('gb_fmax', 'change', e => { st.fmax = Math.max(0, Math.min(100, e.target.value === '' ? 100 : +e.target.value)); onFilter(); });
  on('gb_imp', 'change', e => { st.imp = +e.target.value; onFilter(); });
  on('gb_col', 'change', e => { st.col = e.target.value; draw(); });
  on('gb_pop', 'change', e => { st.pop = +e.target.value; onFilter(); });
  // ---- mouse
  const gb = $('gb'), root = $('sec_browser'); let drag = null, moved = false, raf = 0;
  gb.addEventListener('wheel', e => {
    e.preventDefault(); const r = gb.querySelector('svg').getBoundingClientRect(), span = st.v1 - st.v0 + 1;
    const f = Math.max(0, Math.min(1, (e.clientX - r.left - lay.L) / lay.iw)), c = st.v0 + f * span, ns = span * (e.deltaY < 0 ? .7 : 1 / .7);
    setView(c - f * ns, c - f * ns + ns - 1);
  }, {passive: false});
  gb.addEventListener('dblclick', e => { const r = gb.querySelector('svg').getBoundingClientRect(), span = st.v1 - st.v0 + 1, f = Math.max(0, Math.min(1, (e.clientX - r.left - lay.L) / lay.iw)), c = st.v0 + f * span; setView(c - span / 4, c + span / 4); });
  gb.addEventListener('mousedown', e => { if(e.button === 0 && !e.target.closest('[data-ov]')) drag = {x: e.clientX, v0: st.v0, span: st.v1 - st.v0 + 1, moved: 0}; });
  window.addEventListener('mousemove', e => { if(!drag) return; const dx = e.clientX - drag.x; drag.moved = Math.max(drag.moved, Math.abs(dx)); if(drag.moved <= 3 || raf) return;
    raf = requestAnimationFrame(() => { raf = 0; if(drag) setView(drag.v0 - dx / lay.iw * drag.span, drag.v0 - dx / lay.iw * drag.span + drag.span - 1); }); });
  window.addEventListener('mouseup', () => { if(drag){ moved = drag.moved > 3; drag = null; setTimeout(() => { moved = false; }, 0); } });
  window.addEventListener('resize', () => { if($('gb')) draw(); });
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-k],[data-gi],[data-bin],[data-ov]'); if(!a || moved) return; e.preventDefault();
    if(a.dataset.k !== undefined){ const k = +a.dataset.k; if(B.c[k] !== st.ci){ st.ci = B.c[k]; $('gb_chr').value = st.ci; const s = Math.max(500, B.e[k] - B.s[k]) * 2; setView(B.s[k] - s, B.e[k] + s); } showSite(k); }
    else if(a.dataset.gi !== undefined){ const gi = +a.dataset.gi; if(G.c[gi] !== st.ci || a.tagName === 'A') goGene(gi); else showGene(gi); }
    else if(a.dataset.bin !== undefined){ const b = +a.dataset.bin, span = st.v1 - st.v0 + 1, c = st.v0 + (b + .5) * span / lay.nb; setView(c - span / 16, c + span / 16); }
    else { const r = gb.querySelector('svg').getBoundingClientRect(), c = Math.max(1, Math.min(len(), (e.clientX - r.left - lay.L) / lay.iw * len())), h = (st.v1 - st.v0 + 1) / 2; setView(c - h, c + h); }
  });
  window.__gb = {st, B, G, draw, setView, goRegion, showSite, showGene, goGene, refilter, onFilter, filt, get lay(){ return lay; }};
  refilter(); syncReg(); draw(); doTables(); summaries();
};

const TABS = [['overview', 'Overview'], ['quality', 'Input quality'], ['landscape', 'TE landscape'], ['samples', 'Samples']];
if(D.browser) TABS.splice(3, 0, ['browser', 'Genome browser']);
if(D.pops) TABS.push(['populations', 'Populations']);
if(D.pca) TABS.push(['pca', 'PCA']);
document.getElementById('title').textContent = D.title;
document.getElementById('sub').textContent = D.run + ' · ' + D.n_samples + ' samples · ' + D.n_sites.toLocaleString() + ' insertion sites · generated ' + D.generated;
const nav = document.getElementById('nav'), main = document.getElementById('main'), built = {};
function show(id){
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  main.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'sec_'+id));
  if(!built[id]){ built[id] = true; document.getElementById('sec_'+id).innerHTML = S[id](); if(S[id].after) S[id].after(); }
  location.hash = id;
}
TABS.forEach(([id, label]) => { const b = document.createElement('button'); b.textContent = label; b.dataset.id = id; b.onclick = () => show(id); nav.appendChild(b);
  const s = document.createElement('section'); s.id = 'sec_'+id; main.appendChild(s); });
show(TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
</script>
</body>
</html>
